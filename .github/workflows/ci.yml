name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Verify Environment
        run: java -version

      - name: Run Test Suite (53 Tests with Paranoid Netty Leak Detection)
        run: mvn clean test --batch-mode --no-transfer-progress

      - name: Build Standalone Fat-JAR
        run: mvn package -DskipTests --batch-mode --no-transfer-progress

      - name: Upload Shaded Binary Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aethelgard-jar
          path: target/aethelgard.jar
          retention-days: 14
